<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ if .IsHome }}{{ site.Title }}{{ else }}{{ .Title }} · {{ site.Title }}{{ end }}</title>
  <meta name="description" content="{{ with .Description }}{{ . }}{{ else }}{{ site.Params.marketing.seo.description }}{{ end }}">

  <link rel="icon" type="image/png" sizes="32x32" href="/favicon/favicon-32.png">
  <link rel="apple-touch-icon" sizes="180x180" href="/favicon/favicon-180.png">
  <link rel="icon" type="image/png" sizes="192x192" href="/favicon/favicon-192.png">

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA==" crossorigin="anonymous" referrerpolicy="no-referrer">
  <link rel="stylesheet" href="/css/main.css">
  {{ block "head_extra" . }}{{ end }}
</head>
<body>
  <div class="topnav">
    <div class="topnav-inner">
      <a class="brand" href="/">Iris Ma</a>
      <nav>
        <a href="/#publications">Publications</a>
        <a href="/#mentoring">Mentoring</a>
        <a href="/uploads/resume.pdf">CV</a>
      </nav>
    </div>
  </div>

  {{ block "main" . }}{{ end }}

  <footer class="site-footer">
    <a href="/privacy/">Privacy</a> · <a href="/terms/">Terms</a> · © {{ now.Year }} Iris Ma
  </footer>

  <!-- TEMPORARY palette preview switcher — remove once a theme is chosen -->
  <div id="theme-preview-switcher">
    <div class="label">Preview color theme</div>
    <button data-variant="" data-color="#0f6e66">Teal (current)</button>
    <button data-variant="slate" data-color="#4338ca">Slate &amp; Indigo</button>
    <button data-variant="terracotta" data-color="#c2410c">Terracotta</button>
    <button data-variant="navy" data-color="#1e3a5f">Navy &amp; Burgundy</button>
    <button data-variant="mono" data-color="#111111">Monochrome</button>
    <button data-variant="forest" data-color="#166534">Forest</button>
  </div>
  <script>
    (function () {
      var root = document.documentElement;
      var fromUrl = new URLSearchParams(location.search).get('theme');
      var saved = fromUrl !== null ? fromUrl : (localStorage.getItem('themeVariant') || '');
      if (fromUrl !== null) localStorage.setItem('themeVariant', fromUrl);
      if (saved) root.setAttribute('data-theme-variant', saved);
      document.querySelectorAll('#theme-preview-switcher button').forEach(function (btn) {
        var dot = document.createElement('span');
        dot.className = 'dot';
        dot.style.background = btn.getAttribute('data-color');
        btn.prepend(dot);
        if (btn.getAttribute('data-variant') === saved) btn.classList.add('active');
        btn.addEventListener('click', function () {
          var v = btn.getAttribute('data-variant');
          if (v) { root.setAttribute('data-theme-variant', v); }
          else { root.removeAttribute('data-theme-variant'); }
          localStorage.setItem('themeVariant', v);
          document.querySelectorAll('#theme-preview-switcher button').forEach(function (b) { b.classList.remove('active'); });
          btn.classList.add('active');
        });
      });
    })();
  </script>
</body>
</html>
