<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ if .IsHome }}{{ site.Title }}{{ else }}{{ .Title }} · {{ site.Title }}{{ end }}</title>
  <meta name="description" content="{{ with .Description }}{{ . }}{{ else }}{{ site.Params.marketing.seo.description }}{{ end }}">

  <link rel="icon" type="image/png" sizes="32x32" href="/favicon/favicon-32.png">
  <link rel="apple-touch-icon" sizes="180x180" href="/favicon/favicon-180.png">
  <link rel="icon" type="image/png" sizes="192x192" href="/favicon/favicon-192.png">

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA==" crossorigin="anonymous" referrerpolicy="no-referrer">
  <link rel="stylesheet" href="/css/main.css">
  {{ block "head_extra" . }}{{ end }}
</head>
<body>
  <div class="topnav">
    <div class="topnav-inner">
      <a class="brand" href="/">Iris Ma</a>
      <nav>
        <a href="/#publications">Publications</a>
        <a href="/#mentoring">Mentoring</a>
        <a href="/uploads/resume.pdf">CV</a>
      </nav>
    </div>
  </div>

  {{ block "main" . }}{{ end }}

  <footer class="site-footer">
    <a href="/privacy/">Privacy</a> · <a href="/terms/">Terms</a> · © {{ now.Year }} Iris Ma
  </footer>
</body>
</html>
